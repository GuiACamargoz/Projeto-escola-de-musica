{% extends 'agendamento/base.html' %}

{% block content %}

    <h1 style="color: #28a745;">Primeiro Passo Concluído! ✅</h1>
    
    <p style="font-size: 1.2em; margin: 20px 0;">Seu primeiro horário foi adicionado ao carrinho.</p>

    <div class="actions" style="margin-top: 20px; display: flex; justify-content: center; gap: 20px;">
        
        <a href="{% url 'agendamento:home' %}" class="btn" style="background-color: #17a2b8; color: white; padding: 15px 25px; text-decoration: none; border-radius: 5px; font-size: 1.1em;">

        </a>
        
        <a href="{% url 'agendamento:ver_carrinho' %}" class="btn" style="background-color: #007bff; color: white; padding: 15px 25px; text-decoration: none; border-radius: 5px; font-size: 1.1em;">

    </div>

</div>
