{% extends 'agendamento/base.html' %}

{% block content %}
    <h1>Crie sua Conta</h1>
    <p>Por favor, preencha o formulário abaixo para se cadastrar:</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <p><button type="submit">Cadastrar</button></p>
    </form>
    <br>
    <p>Já tem uma conta? <a href="{% url 'agendamento:login' %}">Entre aqui</a>.</p>
{% endblock %}
